# ─────────────────────────────────────────────────────────────────
# Genera tu tarjeta de "top languages" DENTRO de tu propio repo,
# sin depender del servicio en vivo de github-readme-stats.vercel.app
#
# Cómo instalarlo:
# 1. Este archivo va en: .github/workflows/metrics.yml
#    (dentro del repo aaalejo8/aaalejo8, el de tu perfil)
# 2. No necesitás crear ningún token ni secret: usa el GITHUB_TOKEN
#    que GitHub genera automáticamente para cada repo.
# 3. Corré el workflow una vez manualmente (pestaña "Actions" →
#    elegí "Metrics" → "Run workflow") para generar la primera imagen.
# 4. Después se va a re-generar solo, automáticamente, todos los días.
# ─────────────────────────────────────────────────────────────────

name: Metrics

on:
  # se ejecuta automáticamente todos los días a las 05:00 UTC
  schedule:
    - cron: "0 5 * * *"
  # también podés dispararlo a mano desde la pestaña "Actions"
  workflow_dispatch:
  # y cada vez que hagas push al repo del perfil
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # token automático del repo, no hay que crear nada
          token: ${{ secrets.GITHUB_TOKEN }}

          # tu usuario
          user: aaalejo8

          # el archivo que se va a generar y commitear al repo
          filename: github-metrics.svg

          # activa el plugin de "lenguajes más usados"
          # (el equivalente al top-langs que ya tenías)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # apagamos las secciones que no usabas antes, para
          # mantenerlo simple y liviano (podés activarlas después)
          plugin_achievements: no
          plugin_habits: no
          plugin_introduction: no

          # tema oscuro, lo más parecido a los colores que ya usabas
          # (bg_color=0f172a, title_color=d4b07a, text_color=c9d1d9)
          config_display: large
          config_theme: dark
          config_timezone: America/Argentina/Buenos_Aires
